# FoodOnTheGo — review deployment for techpio.tech
#
# NOTHING HERE BINDS A PUBLIC PORT. The only published port is
# 127.0.0.1:8090, which is not reachable from the internet. Whatever already
# owns 80 and 443 on this box — the server serving piodesk.com — keeps them,
# and a vhost proxies to this stack. That is deliberate: a compose file that
# grabbed 80 would either fail to start or take the existing site down, and
# both of those are worse than an extra proxy hop.

name: foodonthego

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-foodonthego}
      MYSQL_USER: ${DB_USERNAME:-foodonthego}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12
    # No ports. The database is reachable only from this compose network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  php:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Storage outlives the container: logs, and anything the app writes.
      - backend-storage:/app/storage
    healthcheck:
      test: ['CMD', 'php', '-r', 'exit(0);']
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - php
    ports:
      # Localhost only. See the note at the top of this file.
      - '127.0.0.1:8090:80'
    volumes:
      - backend-storage:/app/storage:ro

  # How the outside world reaches this stack.
  #
  # NOT A REVERSE PROXY ON THIS BOX. Ports 80 and 443 belong to `piodesk-edge-1`,
  # the nginx serving piodesk.com, and that application is not to be touched —
  # which rules out a vhost, a certificate, and anything else that would need a
  # share of those ports. Its config is generated from a template outside this
  # repository, so even a file dropped into its conf.d would not survive a
  # restart of it.
  #
  # cloudflared dials OUT to Cloudflare and serves the hostname from there. It
  # binds nothing, publishes nothing, and needs no inbound firewall rule, so
  # there is no port for it to contend over. TLS is terminated at Cloudflare's
  # edge; `deploy/nginx/app.conf` already tells PHP-FPM the scheme is https, so
  # generated URLs are correct without trusting a forwarded header.
  #
  # Opt-in, by profile: `docker compose --profile tunnel up -d`. Without it the
  # stack runs exactly as before and a missing token breaks nothing.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel']
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Created in the Cloudflare Zero Trust dashboard; it carries the tunnel's
      # identity and its routing lives there rather than in a file here. Put it
      # in deploy/.env, which is gitignored.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    # `latest` deliberately, and it is the one place in this deployment that is
    # not pinned. A tunnel client talks to a moving edge and Cloudflare warns on
    # stale versions; pinning it would trade a supported client for a
    # reproducible one. Nothing it builds ends up in the product — it only
    # forwards bytes to `web`.

volumes:
  mysql-data:
  redis-data:
  backend-storage:
