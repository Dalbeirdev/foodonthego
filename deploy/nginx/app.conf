# Inside the container. Whatever sits in front — the Cloudflare Tunnel, or
# nothing at all when the stack is published on a plain port — reaches this.

# The scheme the *customer's* browser used, which is not always the scheme this
# server is answering on. A tunnel terminates TLS and forwards plain HTTP with
# X-Forwarded-Proto; published directly on a port, there is no such header and
# the connection's own scheme is the truth. Hard-coding either one makes Laravel
# generate absolute URLs for an address the browser cannot reach.
map $http_x_forwarded_proto $fotg_scheme {
    default  $scheme;
    "https"  https;
    "http"   http;
}

map $fotg_scheme $fotg_https {
    default  "";
    "https"  on;
}

server {
    listen 80;
    server_name _;

    # Uploads and JSON bodies. Modest on purpose: nothing in this API takes a
    # large payload, and a generous limit is a free denial-of-service.
    client_max_body_size 8m;

    # The API. Everything under /api goes to Laravel and nothing else does.
    #
    # '^~' rather than a bare prefix so the static-asset regex below can never
    # win over it: regex locations outrank plain prefixes, and an API path that
    # happened to end in .js or .json would otherwise be looked for on disk.
    location ^~ /api {
        root /app/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php$ {
        root /app/public;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param REQUEST_SCHEME $fotg_scheme;
        fastcgi_param HTTPS $fotg_https if_not_empty;
        fastcgi_read_timeout 60s;
    }

    # --- the operator shells ------------------------------------------------
    #
    # '^~' again, and for a sharper reason: without it the static-asset regex
    # below claims every .js and .css under these paths and looks for them in
    # the customer app's directory, where they do not exist. The shells would
    # serve their HTML and then 404 every file it asks for.
    #
    # Their bundles are content-addressed by Vite (index-<hash>.js), so a long
    # immutable cache is honest there: a changed file arrives under a changed
    # name. That is not true of the customer app — see below.
    location ^~ /restaurant/assets/ {
        alias /var/www/restaurant/assets/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    location ^~ /admin/assets/ {
        alias /var/www/admin/assets/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    location ^~ /restaurant {
        alias /var/www/restaurant;
        try_files $uri $uri/ /restaurant/index.html;
    }

    location ^~ /admin {
        alias /var/www/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # --- the customer app ---------------------------------------------------

    location / {
        root /var/www/customer;
        try_files $uri $uri/ /index.html;
    }

    # Everything reaching this regex belongs to the customer app: /api and both
    # operator shells are claimed by '^~' locations above.
    #
    # 'no-cache' is not a missing optimisation, it is the only correct answer.
    # A Flutter web build does not fingerprint its output: main.dart.js,
    # flutter.js, flutter_bootstrap.js and flutter_service_worker.js keep those
    # exact names across every build, and assets/ and canvaskit/ are not hashed
    # either. Marking them immutable told browsers to keep the first build they
    # ever saw for thirty days without asking, which is how a corrected bundle
    # sat on the server while the browser went on running the broken one.
    # 'no-cache' still stores the file and still revalidates cheaply — a 304 on
    # an unchanged asset costs a header exchange, not a re-download.
    #
    # try_files ... =404 rather than the SPA fallback: a missing asset must fail
    # as a missing asset. Falling back to index.html hands the browser HTML
    # where it asked for JavaScript, and the error it then reports describes a
    # parser, not the missing file.
    location ~* \.(?:js|mjs|css|wasm|map|json|woff2?|ttf|otf|png|jpe?g|gif|svg|ico)$ {
        root /var/www/customer;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
}
