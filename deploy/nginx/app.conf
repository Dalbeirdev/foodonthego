# Inside the container. The host's nginx terminates TLS and proxies here.

server {
    listen 80;
    server_name _;

    # Uploads and JSON bodies. Modest on purpose: nothing in this API takes a
    # large payload, and a generous limit is a free denial-of-service.
    client_max_body_size 8m;

    # The API. Everything under /api goes to Laravel and nothing else does.
    location /api {
        root /app/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php$ {
        root /app/public;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTPS on;
        # The host proxy terminated TLS, so Laravel must be told the scheme it
        # is really answering on — otherwise every generated URL comes out http.
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_read_timeout 60s;
    }

    # The operator shells, each on its own path with SPA fallback.
    location /restaurant {
        alias /var/www/restaurant;
        try_files $uri $uri/ /restaurant/index.html;
    }

    location /admin {
        alias /var/www/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # The customer app at the root.
    location / {
        root /var/www/customer;
        try_files $uri $uri/ /index.html;
    }

    # Long cache for fingerprinted assets, none for the entry points — an
    # index.html cached for a year is a deployment nobody can see.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        root /var/www/customer;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
