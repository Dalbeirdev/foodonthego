# For the HOST's nginx — /etc/nginx/sites-available/techpio.tech
#
# This file adds a server block. It edits nothing that already exists, so
# whatever serves piodesk.com is untouched. Enable it with a symlink into
# sites-enabled, test with `nginx -t`, then reload.
#
# certbot rewrites this file when it issues the certificate; the managed lines
# it adds are marked and should be left alone.

server {
    listen 80;
    listen [::]:80;
    server_name techpio.tech www.techpio.tech;

    # Before the certificate exists this is the whole file. Afterwards certbot
    # replaces the body with a redirect to 443.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Laravel reads this to know it is behind TLS. Without it every
        # absolute URL the API generates comes out as http and mixed-content
        # blocking makes the app look broken for reasons nothing logs.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
    }

    # A review deployment has no business in a search index.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
